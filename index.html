<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ポケットマリオランナー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <div class="title-group">
      <h1>ポケットマリオランナー</h1>
      <p class="subtitle">スマホで遊べる横スクロールアクション</p>
    </div>
    <div class="hud">
      <div class="hud__item">コイン <span id="coins">0</span></div>
      <div class="hud__item">タイム <span id="time">0.0s</span></div>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-wrap" aria-label="ゲーム画面">
      <canvas id="game" width="960" height="480" aria-label="横スクロールステージ"></canvas>
      <div id="banner" role="status" aria-live="polite"></div>
    </section>

    <section class="about">
      <h2>遊び方</h2>
      <ul>
        <li>▶: 右に進む / ◀: 左に戻る</li>
        <li>⤒: ジャンプ（空中で押すと短めのジャンプ）</li>
        <li>コインを集めながらゴールの旗に触れたらクリア</li>
        <li>落下や敵に当たったらスタート地点からリスタート</li>
      </ul>
    </section>
  </main>

  <section class="controls" aria-label="タッチ操作ボタン">
    <button class="ctrl" data-action="left" aria-label="左に移動">◀</button>
    <button class="ctrl" data-action="right" aria-label="右に移動">▶</button>
    <button class="ctrl primary" data-action="jump" aria-label="ジャンプ">⤒</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
